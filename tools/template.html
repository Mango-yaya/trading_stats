<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>宏观资金面一页纸 · 2026年11月11日</title>
<style>
  :root{
    --ink:#1a2430;
    --ink-2:#4a5866;
    --ink-3:#7a8794;
    --navy:#1b3f66;
    --blue:#2f6fa8;
    --blue-l:#eaf1f8;
    --gold:#a8802c;
    --gold-l:#f7f1e3;
    --line:#e3e7ec;
    --bg:#f2f4f7;
    --red:#b3352b;
    --green:#2e7d6f;
  }
  *{box-sizing:border-box;-webkit-text-size-adjust:100%;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Helvetica,Arial,sans-serif;
    font-size:16px;
    line-height:1.8;
    word-break:break-word;
    overflow-x:hidden;
  }
  .paper{
    max-width:820px;
    margin:0 auto;
    background:#fff;
    padding:34px 40px 40px;
    box-shadow:0 1px 3px rgba(20,35,55,.06);
  }
  /* ---------- header ---------- */
  .hd{border-bottom:2px solid var(--navy);padding-bottom:16px;margin-bottom:26px;}
  .hd-kicker{font-size:12px;letter-spacing:.18em;color:var(--gold);font-weight:600;margin-bottom:6px;}
  .hd h1{font-size:26px;line-height:1.35;margin:0 0 8px;font-weight:700;color:var(--navy);letter-spacing:.01em;}
  .hd-meta{font-size:13px;color:var(--ink-3);line-height:1.7;}
  .hd-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .tag{display:inline-block;font-size:13px;padding:3px 10px;border-radius:3px;background:var(--blue-l);color:var(--navy);border:1px solid #d3e2ef;}
  .tag.gold{background:var(--gold-l);color:var(--gold);border-color:#e8dcc2;}
  /* ---------- sections ---------- */
  section{margin:0 0 30px;}
  .sec-h{display:flex;align-items:baseline;gap:10px;border-left:4px solid var(--navy);padding-left:11px;margin:0 0 14px;}
  .sec-h .num{font-size:13px;font-weight:700;color:var(--gold);letter-spacing:.08em;}
  .sec-h h2{font-size:19px;margin:0;font-weight:700;color:var(--navy);letter-spacing:.01em;}
  p{margin:0 0 12px;}
  .lead{font-size:15.5px;color:var(--ink-2);}
  /* ---------- 结论摘要 ---------- */
  ol.sum{margin:0;padding-left:0;list-style:none;counter-reset:s;}
  ol.sum li{
    position:relative;
    padding:0 0 0 30px;
    margin-bottom:13px;
    counter-increment:s;
    font-size:16px;
  }
  ol.sum li::before{
    content:counter(s);
    position:absolute;left:0;top:4px;
    width:21px;height:21px;line-height:21px;
    text-align:center;font-size:12px;font-weight:700;
    color:#fff;background:var(--navy);border-radius:2px;
  }
  ol.sum li b{color:var(--navy);}
  .verdict{
    margin-top:16px;padding:14px 16px;background:var(--gold-l);
    border-left:3px solid var(--gold);font-size:15.5px;color:#5c4a24;
  }
  .verdict b{color:#8a6420;}
  /* ---------- 温度计 ---------- */
  .thermo{width:100%;border-collapse:collapse;font-size:15px;}
  .thermo th{
    text-align:left;font-size:12.5px;font-weight:600;color:var(--ink-3);
    letter-spacing:.06em;padding:0 10px 8px;border-bottom:1.5px solid var(--navy);
  }
  .thermo td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  .thermo td:first-child{font-weight:600;color:var(--navy);width:29%;}
  .pill{display:inline-block;font-size:13px;padding:2px 10px;border-radius:11px;white-space:nowrap;font-weight:600;}
  .pill.loose{background:#e8f2ee;color:var(--green);}
  .pill.neutral{background:#eef1f4;color:#55636f;}
  .pill.tight{background:#f8ebe9;color:var(--red);}
  .sum-row{margin-top:14px;padding:13px 16px;background:var(--blue-l);border:1px solid #d3e2ef;border-radius:4px;font-size:15.5px;}
  .sum-row b{color:var(--navy);}
  /* ---------- 维度卡 ---------- */
  .dim{border:1px solid var(--line);border-radius:5px;padding:16px 18px;margin-bottom:14px;background:#fcfcfd;}
  .dim-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .dim-t{font-size:16.5px;font-weight:700;color:var(--navy);}
  .dim dl{margin:0;}
  .dim .row{display:flex;gap:10px;padding:6px 0;border-top:1px dashed #e8ebef;font-size:15px;line-height:1.75;}
  .dim .row:first-child{border-top:none;}
  .dim .k{flex:0 0 62px;color:var(--ink-3);font-size:13.5px;padding-top:2px;}
  .dim .v{flex:1;color:var(--ink-2);}
  .dim .v em{font-style:normal;color:var(--ink);font-weight:600;}
  /* ---------- 图 ---------- */
  .fig{border:1px solid var(--line);border-radius:5px;padding:14px 12px 10px;margin:0 0 12px;background:#fff;}
  .fig-t{font-size:14.5px;font-weight:700;color:var(--navy);margin:0 0 2px;padding-left:2px;}
  .fig-s{font-size:12px;color:var(--ink-3);margin:0 0 8px;padding-left:2px;}
  .fig svg{display:block;width:100%;height:auto;}
  .fig-note{font-size:11.5px;color:var(--ink-3);line-height:1.65;margin:8px 2px 0;}
  .read p{font-size:15.5px;color:var(--ink-2);}
  .read b{color:var(--ink);}
  /* ---------- 推演 ---------- */
  .hzn{border-left:3px solid var(--blue);padding:2px 0 2px 14px;margin-bottom:18px;}
  .hzn h3{font-size:15.5px;margin:0 0 6px;color:var(--navy);font-weight:700;}
  .hzn p{margin:0 0 8px;font-size:15.5px;color:var(--ink-2);}
  .hzn .kpi{font-size:14px;color:var(--ink-3);background:#f6f8fa;border-radius:3px;padding:8px 11px;line-height:1.75;}
  .hzn .kpi b{color:var(--navy);}
  /* ---------- footer ---------- */
  footer{border-top:1px solid var(--line);margin-top:34px;padding-top:16px;font-size:12.5px;color:var(--ink-3);line-height:1.85;}
  footer b{color:var(--ink-2);}
  /* ---------- mobile ---------- */
  @media (max-width:680px){
    .paper{padding:18px 14px 26px;}
    body{font-size:16px;line-height:1.8;}
    .hd{padding-bottom:13px;margin-bottom:22px;}
    .hd h1{font-size:22px;}
    .hd-meta{font-size:12.5px;}
    .sec-h h2{font-size:18px;}
    ol.sum li{font-size:15.5px;padding-left:27px;}
    .verdict{font-size:15px;padding:12px 13px;}
    /* 表格转卡片 */
    table.thermo{display:block;width:100%;}
    table.thermo thead{display:none;}
    table.thermo tbody{display:block;width:100%;}
    table.thermo tr{
      display:block;width:100%;
      background:#fff;border:1px solid var(--line);border-radius:10px;
      padding:12px 14px 10px;margin-bottom:10px;
    }
    table.thermo td{
      display:flex;justify-content:flex-start;align-items:flex-start;gap:6px;
      width:100%;padding:5px 0;border:none;font-size:15px;
    }
    table.thermo td::before{
      content:attr(data-label);
      flex:0 0 70px;color:var(--ink-3);font-size:13.5px;font-weight:400;
    }
    table.thermo td:first-child{
      display:block;width:100%;
      font-size:17px;font-weight:700;color:var(--blue);
      padding:0 0 8px;margin-bottom:6px;border-bottom:1px dashed var(--line);
    }
    table.thermo td:first-child::before{display:none;}
    .dim{padding:14px 13px;}
    .dim .row{display:block;padding:7px 0;}
    .dim .k{display:block;padding:0 0 1px;font-size:13px;}
    .dim .v{display:block;}
    .fig{padding:12px 8px 10px;}
    .fig-t{font-size:14px;}
    .hzn{padding-left:12px;}
  }
</style>
</head>
<body>
<div class="paper">
{{HEADER}}

  <!-- ============ 1 结论摘要 ============ -->
  <section>
    <div class="sec-h"><span class="num">01</span><h2>结论摘要</h2></div>
    <ol class="sum">
{{SUMMARY}}
    </ol>
    <div class="verdict">
      <b>核心判断：</b>{{VERDICT}}
    </div>
  </section>

  <!-- ============ 2 分维度分析 ============ -->
  <section>
    <div class="sec-h"><span class="num">02</span><h2>分维度分析</h2></div>
{{DIMS}}
  </section>

  <!-- ============ 3 图表 ============ -->
  <section>
    <div class="sec-h"><span class="num">03</span><h2>图表与解读</h2></div>
{{FIGS}}

    <div class="read">
      <p><b>解读：</b>{{READ}}</p>
    </div>
  </section>

  <!-- ============ 4 未来推演 ============ -->
  <section>
    <div class="sec-h"><span class="num">04</span><h2>未来推演</h2></div>
{{SCENARIOS}}
  </section>

  <!-- ============ 5 免责 ============ -->
  <footer>
{{FOOTER}}
  </footer>

  </div>
</body>
</html>
